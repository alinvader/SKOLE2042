<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>2042</title>
</head>

<body>

    <div class="dropdown">

        <!-- WINDOWS -->
        <div class="os">
            <button class="os-button" onclick="toggleWindows()">
                Windows
            </button>

            <div class="popup windows-list" id="windowsList">

                <h3>Ghost Spectre</h3>

                <button>Windows 10</button>
                <button>Windows 11</button>

            </div>
        </div>


        <!-- LINUX -->
        <div class="os">
            <button class="os-button" onclick="toggleLinux()">
                Linux
            </button>

            <div class="popup linux-list" id="linuxList">

                <h3>Bazzite</h3>

                <button>CashyOS</button>

            </div>
        </div>

    </div>


    <script>

        function toggleWindows() {

            document
                .getElementById("windowsList")
                .classList.toggle("show");

        }


        function toggleLinux() {

            document
                .getElementById("linuxList")
                .classList.toggle("show");

        }

    </script>

</body>

</html>
